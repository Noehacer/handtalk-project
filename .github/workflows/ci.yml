name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias de prueba
        working-directory: backend
        # Instala solo lo necesario para los tests (sin TF/OpenCV/MediaPipe,
        # que son mockeados en conftest.py)
        run: |
          pip install \
            fastapi uvicorn[standard] \
            pytest httpx \
            python-jose[cryptography] passlib[bcrypt] \
            python-dotenv pillow numpy \
            slowapi python-multipart

      - name: Ejecutar tests
        working-directory: backend
        run: pytest tests/ -v --tb=short

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — expo-doctor
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm install

      - name: Verificar configuración de Expo
        working-directory: frontend
        run: npx expo-doctor@latest || true
